<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2033;--mut:#6b7280;--line:#e6e8f0;--pri:#5b4bdb;--soft:#eeebff}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-columns:250px 1fr 440px;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;min-height:0}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:15px}
.up{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:600}
.up:hover{filter:brightness(1.1)}
.label{font-size:12px;color:var(--mut);margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
#list{flex:1;overflow:auto}
.doc{padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc:hover{background:var(--bg)}.doc.on{background:var(--soft);color:var(--pri);font-weight:600}
.mut{color:var(--mut);font-size:13px;padding:0 4px}
.stats{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;background:var(--bg)}
.stats b{display:block;font-size:20px}.stats div{display:flex;justify-content:space-between;align-items:end;margin-top:6px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px}
#viewer{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;place-items:center}
#viewer iframe{width:100%;height:100%;border:0}
.empty{text-align:center;color:var(--mut)}.empty h2{color:var(--ink);margin:8px 0}
section{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.u{align-self:flex-end;background:var(--pri);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%}
.b{align-self:flex-start;max-width:100%;line-height:1.55;font-size:14.5px}
.b p{margin:.4em 0}.b ul,.b ol{padding-left:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag,.chip{font-size:11.5px;border-radius:999px;padding:3px 9px;border:1px solid var(--line);background:var(--bg);color:var(--mut)}
.chip{cursor:pointer;color:var(--pri);background:var(--soft);border-color:transparent;font-weight:600}
.t-rag{background:#e7f6ec;color:#17803d;border-color:transparent}.t-cache{background:#e6f0ff;color:#1d4ed8;border-color:transparent}
.t-skipped{background:#fff4e0;color:#b45309;border-color:transparent}.t-full{background:#fde8e8;color:#b91c1c;border-color:transparent}
.sug{display:flex;flex-direction:column;gap:8px}
.sug button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink)}
.sug button:hover{border-color:var(--pri);background:var(--soft)}
.box{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.box input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
.box input:focus{border-color:var(--pri)}
.box button{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600}
.dots{color:var(--mut)}
@media(max-width:1100px){body{grid-template-columns:220px 1fr}main{display:none}}
</style></head>
<body>
<aside>
  <div class="brand"><span class="logo">P</span>Paper Assistant</div>
  <button class="up" onclick="$('#file').click()">+ Upload paper</button>
  <input type="file" id="file" accept=".pdf" hidden onchange="upload(this.files[0])">
  <div class="label">Your papers</div>
  <div id="list"></div>
  <div class="stats"><span class="mut" style="padding:0">Cost savings</span>
    <div><span>LLM calls avoided</span><b id="saved">0</b></div>
    <div><span>Tokens used</span><b id="toks">0</b></div></div>
</aside>
<main><div id="viewer"><div class="empty"><div style="font-size:44px">📄</div><h2>Upload a research paper</h2><p>Drop a PDF anywhere, or use the button on the left.</p></div></div></main>
<section>
  <div class="head" id="title">Chat</div>
  <div id="msgs"></div>
  <div class="box"><input id="q" placeholder="Ask a question about the paper..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Ask</button></div>
</section>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const SUG=["What problem does this paper try to solve?","What method do the authors propose?","What are the main results and limitations?"];
let docs=[],cur=null,chats={};
async function loadDocs(sel){docs=await(await fetch('/api/documents')).json();if(sel)select(sel);else if(!cur&&docs.length)select(docs[0].doc_id);else renderList()}
function renderList(){$('#list').innerHTML=docs.map(d=>`<div class="doc ${d.doc_id===cur?'on':''}" title="${esc(d.name)}" onclick="select('${d.doc_id}')">📄 ${esc(d.name)}</div>`).join('')||'<p class="mut">No papers yet</p>'}
function showPdf(page){$('#viewer').innerHTML=`<iframe src="/pdf/${cur}${page?'#page='+page:''}"></iframe>`}
function select(id){cur=id;chats[id]=chats[id]||[];const d=docs.find(x=>x.doc_id===id);$('#title').textContent=d?d.name:'Chat';renderList();showPdf();draw()}
async function upload(f){if(!f)return;$('#title').textContent='Indexing '+f.name+'...';const fd=new FormData();fd.append('file',f);
  try{const r=await fetch('/upload',{method:'POST',body:fd});if(!r.ok)throw new Error((await r.json()).detail||'Upload failed');const j=await r.json();await loadDocs(j.doc_id)}
  catch(e){alert(e.message);$('#title').textContent='Chat'}}
function draw(){const c=chats[cur]||[],m=$('#msgs');
  if(!cur){m.innerHTML='<p class="mut">Upload a paper to start chatting.</p>';return}
  if(!c.length){m.innerHTML='<p class="mut">Try one of these:</p><div class="sug">'+SUG.map(s=>`<button onclick="ask(this.textContent)">${esc(s)}</button>`).join('')+'</div>';return}
  m.innerHTML=c.map(x=>{
    if(x.role==='user')return `<div class="u">${esc(x.text)}</div>`;
    if(x.pending)return '<div class="b dots">Thinking...</div>';
    const j=x.meta,tag=j?`<span class="tag t-${j.source}">${{rag:'Retrieved + LLM',cache:'From cache (no LLM)',skipped:'Not in paper (no LLM)',full:'Full paper'}[j.source]}</span><span class="tag">${j.tokens} tokens</span><span class="tag">${j.latency.toFixed(1)}s</span>`+(j.pages||[]).map(p=>`<span class="chip" onclick="showPdf(${p})">p.${p}</span>`).join(''):'';
    return `<div class="b">${marked.parse(esc(x.text))}<div class="meta">${tag}</div></div>`}).join('');
  m.scrollTop=m.scrollHeight}
async function ask(q){q=(q||$('#q').value).trim();if(!q||!cur)return;$('#q').value='';const c=chats[cur],th={role:'bot',pending:true};c.push({role:'user',text:q},th);draw();
  try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doc_id:cur,question:q})});if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail}catch(_){}throw new Error(String(t).slice(0,300))}const j=await r.json();Object.assign(th,{pending:false,text:j.answer,meta:j})}
  catch(e){Object.assign(th,{pending:false,text:'Something went wrong: '+e.message})}
  draw();stats()}
async function stats(){const s=await(await fetch('/stats')).json();const n=k=>(s[k]||{}).queries||0,t=k=>(s[k]||{}).tokens||0;$('#saved').textContent=n('cache')+n('skipped');$('#toks').textContent=(t('rag')+t('full')).toLocaleString()}
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.name.endsWith('.pdf'))upload(f)});
loadDocs().then(()=>{draw();stats()});
</script></body></html>
